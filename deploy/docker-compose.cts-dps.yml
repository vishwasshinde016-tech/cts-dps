# CTS DPS on the bank's shared VM (Phase 6). Docker or Podman compose; the same images run on Kubernetes later.
# Starting replica counts; set the real ones from the sizing in docs/cts-dps/runbook.md (ops.capacity).
# Every container: non-root (image user 10001), read-only root filesystem, no capabilities, CPU and memory limits,
# health check, JSON logs to stdout. Secrets come from the bank's vault as environment at deploy time.
#
#   docker compose -f deploy/docker-compose.cts-dps.yml up -d
#   rollback: set DPS_IMAGE_TAG to the previous tag and run the same command (expand-then-contract migrations)

x-dps-image: &dps-image ${DPS_IMAGE:-covenant-dps}:${DPS_IMAGE_TAG:-latest}
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
x-dps-env: &dps-env
  DPS_ENV: prod
  DPS_AUTH_MODE: JWT
  DPS_DATABASE_URL: ${DPS_DATABASE_URL:?set from the vault}
  DPS_CORE_BASE_URL: ${DPS_CORE_BASE_URL:?Spring app URL}
  DPS_JWT_ISSUER: ${DPS_JWT_ISSUER:-}
  DPS_JWT_AUDIENCE: ${DPS_JWT_AUDIENCE:-dps}
  DPS_JWT_JWKS_URL: ${DPS_JWT_JWKS_URL:-}
  DPS_CORE_SERVICE_TOKEN: ${DPS_CORE_SERVICE_TOKEN:-}
  DPS_STORAGE_DIR: /dms/blobs
  DPS_STAGING_DIR: /dms/staging
  DPS_DERIVED_DIR: /dms/derived
  DPS_SEALS_DIR: /dms/audit-seals
  DPS_AI_ROUTES_FILE: /config/routes.yaml
  # The Document Agent on the bank's Azure OpenAI deployments (deploy/config/routes.example.yaml). Model calls go
  # only to the hosts listed in DPS_AI_ALLOWED_HOSTS; keys come from the vault, never from files.
  DPS_LLM_ENABLED: ${DPS_LLM_ENABLED:-true}
  DPS_AI_ALLOWED_HOSTS: ${DPS_AI_ALLOWED_HOSTS:?the Azure OpenAI host, e.g. bank-ai.openai.azure.com}
  AZURE_API_BASE: ${AZURE_API_BASE:?Azure OpenAI endpoint}
  AZURE_API_KEY: ${AZURE_API_KEY:?from the vault}
  AZURE_API_VERSION: ${AZURE_API_VERSION:-2024-10-21}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
x-dms-ro: &dms-volumes
  - ${DMS_BLOBS:-/srv/dms/blobs}:/dms/blobs:ro
  - ${DMS_STAGING:-/srv/dms/staging}:/dms/staging:ro
  - ${DMS_DERIVED:-/srv/dms/derived}:/dms/derived
  - ${DMS_AUDIT_SEALS:-/srv/dms/audit-seals}:/dms/audit-seals
  - ${DPS_CONFIG:-/srv/dps/config}:/config:ro

x-worker: &worker
  image: *dps-image
  <<: *hardening
  command: ["python", "-m", "dps.worker"]
  cpus: 2
  mem_limit: 3g
  healthcheck:
    test: ["CMD", "python", "-c", "import dps.worker"]
    interval: 60s
    timeout: 10s
x-parser: &parser
  image: *dps-image
  <<: *hardening
  network_mode: none
  cpus: 1
  mem_limit: 2g
  pids_limit: 128
  healthcheck:
    test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/run/dps-parser/parser.sock') else 1)"]
    interval: 30s

services:
  dps-api:
    image: *dps-image
    <<: *hardening
    environment: *dps-env
    volumes: *dms-volumes
    deploy: { replicas: 2 }
    cpus: 1
    mem_limit: 1g
    expose: ["9400"]  # behind the VM's TLS reverse proxy only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s

  # LIGHT pool: three worker + parser pairs (the parser has no network; they share only the socket volume).
  dps-worker-1:
    <<: *worker
    environment: { <<: *dps-env, DPS_WORKER_POOL: STANDARD, DPS_WORKER_ID: light-1,
                   DPS_PARSER_SOCKET: /run/dps-parser/parser.sock }
    volumes:
      - ${DMS_BLOBS:-/srv/dms/blobs}:/dms/blobs:ro
      - ${DMS_STAGING:-/srv/dms/staging}:/dms/staging:ro
      - ${DMS_DERIVED:-/srv/dms/derived}:/dms/derived
      - ${DMS_AUDIT_SEALS:-/srv/dms/audit-seals}:/dms/audit-seals
      - ${DPS_CONFIG:-/srv/dps/config}:/config:ro
      - sock-light-1:/run/dps-parser
  dps-parser-1:
    <<: *parser
    command: ["python", "-m", "dps.parse.server", "/run/dps-parser/parser.sock"]
    environment: { DPS_WORKER_POOL: STANDARD }
    volumes: ["sock-light-1:/run/dps-parser"]
  dps-worker-2:
    <<: *worker
    environment: { <<: *dps-env, DPS_WORKER_POOL: STANDARD, DPS_WORKER_ID: light-2,
                   DPS_PARSER_SOCKET: /run/dps-parser/parser.sock }
    volumes:
      - ${DMS_BLOBS:-/srv/dms/blobs}:/dms/blobs:ro
      - ${DMS_STAGING:-/srv/dms/staging}:/dms/staging:ro
      - ${DMS_DERIVED:-/srv/dms/derived}:/dms/derived
      - ${DMS_AUDIT_SEALS:-/srv/dms/audit-seals}:/dms/audit-seals
      - ${DPS_CONFIG:-/srv/dps/config}:/config:ro
      - sock-light-2:/run/dps-parser
  dps-parser-2:
    <<: *parser
    command: ["python", "-m", "dps.parse.server", "/run/dps-parser/parser.sock"]
    environment: { DPS_WORKER_POOL: STANDARD }
    volumes: ["sock-light-2:/run/dps-parser"]
  dps-worker-3:
    <<: *worker
    environment: { <<: *dps-env, DPS_WORKER_POOL: STANDARD, DPS_WORKER_ID: light-3,
                   DPS_PARSER_SOCKET: /run/dps-parser/parser.sock }
    volumes:
      - ${DMS_BLOBS:-/srv/dms/blobs}:/dms/blobs:ro
      - ${DMS_STAGING:-/srv/dms/staging}:/dms/staging:ro
      - ${DMS_DERIVED:-/srv/dms/derived}:/dms/derived
      - ${DMS_AUDIT_SEALS:-/srv/dms/audit-seals}:/dms/audit-seals
      - ${DPS_CONFIG:-/srv/dps/config}:/config:ro
      - sock-light-3:/run/dps-parser
  dps-parser-3:
    <<: *parser
    command: ["python", "-m", "dps.parse.server", "/run/dps-parser/parser.sock"]
    environment: { DPS_WORKER_POOL: STANDARD }
    volumes: ["sock-light-3:/run/dps-parser"]

  # HEAVY pool: OCR, layout and vision. Bigger image (INSTALL_HEAVY=1).
  dps-worker-heavy-1:
    <<: *worker
    image: ${DPS_HEAVY_IMAGE:-covenant-dps-heavy}:${DPS_IMAGE_TAG:-latest}
    cpus: 4
    mem_limit: 8g
    environment: { <<: *dps-env, DPS_WORKER_POOL: HEAVY, DPS_WORKER_ID: heavy-1,
                   DPS_PARSER_SOCKET: /run/dps-parser/parser.sock }
    volumes:
      - ${DMS_BLOBS:-/srv/dms/blobs}:/dms/blobs:ro
      - ${DMS_STAGING:-/srv/dms/staging}:/dms/staging:ro
      - ${DMS_DERIVED:-/srv/dms/derived}:/dms/derived
      - ${DMS_AUDIT_SEALS:-/srv/dms/audit-seals}:/dms/audit-seals
      - ${DPS_CONFIG:-/srv/dps/config}:/config:ro
      - sock-heavy-1:/run/dps-parser
  dps-parser-heavy-1:
    <<: *parser
    image: ${DPS_HEAVY_IMAGE:-covenant-dps-heavy}:${DPS_IMAGE_TAG:-latest}
    cpus: 2
    mem_limit: 6g
    command: ["python", "-m", "dps.parse.server", "/run/dps-parser/parser.sock"]
    environment: { DPS_WORKER_POOL: HEAVY }
    volumes: ["sock-heavy-1:/run/dps-parser"]

  # Virus scanning for the DMS (called from the Spring app, not by DPS). Signatures from the bank's mirror.
  clamav:
    image: clamav/clamav:1.4.1
    cpus: 1
    mem_limit: 2g
    expose: ["3310"]
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    restart: unless-stopped

volumes:
  sock-light-1: { driver_opts: { type: tmpfs, device: tmpfs } }
  sock-light-2: { driver_opts: { type: tmpfs, device: tmpfs } }
  sock-light-3: { driver_opts: { type: tmpfs, device: tmpfs } }
  sock-heavy-1: { driver_opts: { type: tmpfs, device: tmpfs } }
