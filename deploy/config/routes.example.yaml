# Model routes for the Document Agent (DPS_AI_ROUTES_FILE). Copy to the config folder as routes.yaml and set the
# bank's Azure OpenAI deployment names. "azure/<deployment>" uses AZURE_API_BASE, AZURE_API_KEY, AZURE_API_VERSION.
# Only "azure/..." models are allowed: DPS refuses to start the model with any other prefix (gateway.route_problem),
# because "openai/...", "anthropic/..." and the like call that provider's public host.
# small: document type (second opinion); strong: the Document Agent's reads; vision: scanned pages read from
# their images.
# max_tokens: the longest answer; covenant lists of a long agreement need more than 3000 (cut-off JSON is lost).
defaults: { max_tokens: 16000, timeout_s: 60, temperature: null, retries: 3 }
routes:
  small:      { provider: azure, deployment: azure/gpt-4.1-mini, rpm: 300 }
  strong:     { provider: azure, deployment: azure/gpt-4.1, rpm: 120, timeout_s: 90 }
  vision:     { provider: azure, deployment: azure/gpt-4o, rpm: 60, timeout_s: 90 }
budgets:
  per_job_tokens: 150000
  per_tenant_day_tokens: 20000000
