# Dependency, code and image scans on every push and pull request, and weekly so a new CVE in an unchanged
# dependency is still caught. Fails on HIGH or CRITICAL findings that have a fix.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: DPS dependencies (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dps
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - run: pip install -e . pip-audit
      # chromadb comes with crewai and is never imported by DPS (no crew memory or knowledge sources);
      # these advisories have no fixed release yet. Drop the ignores when crewai moves to a fixed chromadb.
      - name: Audit
        run: >-
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  bandit:
    name: DPS code scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "bandit==1.8.*"
      # Every severity fails the build; a reviewed false positive carries "# nosec <test id>" in the code.
      - name: Scan
        run: bandit -r dps/src -q

  semgrep:
    name: Code scan (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Scan
        run: semgrep scan --config p/default --metrics=off --error

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Build
        run: docker build -t cts-dps:scan dps
      - name: Scan DPS
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: cts-dps:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
