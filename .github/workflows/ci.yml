# DPS tests, lint and the golden-set extraction gate on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dps:
    name: DPS (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # The image installs the package, not the source tree: prove the installed wheel carries its data files
      # (the taxonomy YAML was once left out and every covenant job would have failed in Docker).
      - name: Installed package smoke
        run: |
          pip wheel --no-deps -q -w "$RUNNER_TEMP/whl" .
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install -q "$RUNNER_TEMP"/whl/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" -c "from dps.skills.covenants.taxonomy import get; t = get(); assert len(t.types) > 200, len(t.types); from dps.skills import load; [load(n) for n in ('covenants', 'sanction', 'amendment_diff', 'certificate', 'schedule_terms', 'statement_lines', 'commentary')]; print('installed package ok', t.version, len(t.types))"
      - name: Tests and coverage
        run: pytest
      - name: Golden-set evaluator and review tool
        run: pytest ../golden-set -q
      # Extraction regression gate: DPS's own parser and extractors over the synthetic golden set.
      - name: Golden-set extraction gate (synthetic)
        run: |
          python ../golden-set/predict.py --out ../golden-predictions
          python ../golden-set/evaluate.py --predictions ../golden-predictions --statuses SYNTHETIC
      # The same documents through the production pipeline (skill pack, ledger, merge, scoring), AI off; with
      # recorded replies once they are committed (golden-set/replies). Improvement plan Q1.
      - name: Golden-set gate on the production pipeline
        run: |
          python ../golden-set/predict.py --out ../golden-predictions-pipeline --pipeline
          python ../golden-set/evaluate.py --predictions ../golden-predictions-pipeline --statuses SYNTHETIC

  # Production DPS runs on SQL Server; SQLite hides dialect bugs.
  dps-sqlserver:
    name: DPS on SQL Server
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P Ci-only-Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: dps
    env:
      DPS_TEST_DATABASE_URL: mssql+pymssql://sa:Ci-only-Passw0rd@localhost:1433/dps_test
      DPS_DATABASE_URL: mssql+pymssql://sa:Ci-only-Passw0rd@localhost:1433/dps_migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,mssql]"
      - name: Create databases
        run: |
          python - <<'PY'
          import pymssql
          conn = pymssql.connect("localhost", "sa", "Ci-only-Passw0rd", autocommit=True)
          for name in ("dps_test", "dps_migrations"):
              conn.cursor().execute(f"CREATE DATABASE {name}; ALTER DATABASE {name} SET READ_COMMITTED_SNAPSHOT ON")
          PY
      - name: Migrations, and no drift from the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest --no-cov

  image:
    name: DPS image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build
        run: docker build -t cts-dps:ci dps
