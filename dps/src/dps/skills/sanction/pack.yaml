name: sanction
version: 1.0.0
job_types: [EXTRACT_SANCTION]
routes: {extract: strong}
tools: [page_text, search_text, find_definition, covenant_library, validate_formula]
page_selection: {max_pages: 15}
limits: {max_tool_calls: 6, max_model_turns: 2, max_seconds: 180, token_budget: 80000}
prompt: prompt.md
schema: schema.json
field_risk: {SANCTIONED_AMOUNT: HIGH, TENOR_MONTHS: HIGH, FACILITY_TYPE: HIGH, INTEREST_RATE: HIGH,
             SECURITY: MEDIUM, CONDITIONS_PRECEDENT: MEDIUM, VALIDITY: MEDIUM, "*": HIGH}
thresholds: {MEDIUM: 0.95, LOW: 0.90}
