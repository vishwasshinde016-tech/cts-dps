  - name: legal_role
    type: string
    description: 'Actual role: covenant, representation, condition, payment, pricing, definition, permission, event,
      remedy or regulatory observation.'
    required: false
  - name: scope
    type: string
    description: Obligor/beneficiary and agreement, facility, tranche, group/entity or asset scope; retain exclusions.
    required: false
  - name: effective_terms
    type: string
    description: As-of and effective dates, document status (draft/executed/unknown), source authority, amendment
      precedence and affected periods.
    required: false
  - name: schedule_terms
    type: string
    description: Actual observation/test period, cadence, delivery deadline, anchor/offset, business/calendar days,
      timezone and holiday convention; unknown stays unknown.
    required: false
  - name: conditions_exceptions
    type: string
    description: Activation, permitted exceptions, baskets, materiality, knowledge qualifiers and dependencies with
      exact source references.
    required: false
  - name: consequence_terms
    type: string
    description: Only expressly supported cure, notice, waiver, default, prepayment, pricing or remedy consequences;
      preserve role and linkage.
    required: false
  - name: review_status
    type: string
    description: Extraction uncertainty, missing definitions/documents, ambiguity and human-review reason; extraction
      alone cannot assert legal compliance.
    required: false
  - name: observation_terms
    type: string
    description: Reported status, source/authority, jurisdiction, as-of date, rule version, verification and contractual
      linkage if any; do not infer misconduct.
