name: waiver
version: 1.0.0
# Full review WP9 (F10): waiver and consent letters, read against the approved covenants Spring sends.
job_types: [EXTRACT_WAIVER]
routes: {extract: strong}
tools: [page_text, search_text, find_definition, covenant_library]
page_selection: {max_pages: 15}
limits: {max_tool_calls: 6, max_model_turns: 2, max_seconds: 180, token_budget: 60000}
prompt: prompt.md
schema: schema.json
# A waiver changes whether a breach is a breach: always reviewed.
field_risk: {"*": HIGH}
thresholds: {MEDIUM: 0.95, LOW: 0.90}
