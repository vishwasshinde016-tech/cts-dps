name: statement_lines
version: 2.0.0
# EXTRACT_STATEMENT keeps the proven Statement Processing flow (page finder, table reader, label memory, AI check);
# this pack adds the accounting identities and the restatement diff to its result.
engine: legacy_flow
job_types: [EXTRACT_STATEMENT]
routes: {extract: strong, images: vision}
page_selection: {max_pages: 12}
limits: {max_model_turns: 2, token_budget: 80000}
prompt: prompt.md
schema: schema.json
field_risk: {REVENUE: HIGH, EBITDA: HIGH, PAT: HIGH, TOTAL_DEBT: HIGH, NET_WORTH: HIGH, CURRENT_ASSETS: HIGH,
             CURRENT_LIABILITIES: HIGH, "*": MEDIUM}
thresholds: {MEDIUM: 0.95, LOW: 0.90}
