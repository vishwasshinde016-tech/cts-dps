# DPS error catalogue (contract-v1). Every error DPS returns or records uses one of these codes.
# class decides handling: REQUEST and SECURITY never retry; TRANSIENT retries with back-off; CONTENT and QUALITY
# go to a person; DEGRADED continues without AI; INTERNAL retries once, then DEAD.
# http: the status when the error is an API response; null when it is only recorded on a job or a field.
# message: the user-facing sentence (English). Support sees the detail in the job and the logs.
version: 1.0.0
errors:
  # --- request (returned at the API, no job created) ---
  - { code: VALIDATION_FAILED, class: REQUEST, http: 400, retry: false, message: "The request is not valid. See details for the fields to fix." }
  - { code: INVALID_INPUT, class: REQUEST, http: 400, retry: false, message: "The request breaks a rule. See details." }
  - { code: IDEMPOTENCY_KEY_REQUIRED, class: REQUEST, http: 400, retry: false, message: "Send an Idempotency-Key header." }
  - { code: BASE_REQUIRED, class: REQUEST, http: 400, retry: false, message: "Send the approved covenants (context.baseCovenants) with an amendment or waiver job." }
  - { code: IDEMPOTENCY_KEY_REUSED, class: REQUEST, http: 409, retry: false, message: "This Idempotency-Key was used for a different request." }
  - { code: UNSUPPORTED_JOB_TYPE, class: REQUEST, http: 422, retry: false, message: "This job type is not available yet." }
  - { code: UNSUPPORTED_FORMAT, class: REQUEST, http: 400, retry: false, message: "This file type cannot be processed." }
  - { code: TOO_MANY_PAGES, class: REQUEST, http: 400, retry: false, message: "The file has too many pages. Split it and send the parts." }
  - { code: TENANT_MISMATCH, class: REQUEST, http: 403, retry: false, message: "The request is for another tenant." }
  - { code: FORBIDDEN, class: REQUEST, http: 403, retry: false, message: "You are not allowed to do this." }
  - { code: UNAUTHORIZED, class: REQUEST, http: 401, retry: false, message: "Sign-in is missing or has expired." }
  - { code: NOT_FOUND, class: REQUEST, http: 404, retry: false, message: "Not found." }
  - { code: RESULT_NOT_READY, class: REQUEST, http: 404, retry: true, message: "The job has not finished yet." }
  - { code: JOB_CANCELLED, class: REQUEST, http: 410, retry: false, message: "The job was cancelled." }
  - { code: JOB_FINISHED, class: REQUEST, http: 409, retry: false, message: "The job has already finished." }
  - { code: JOB_NOT_RETRYABLE, class: REQUEST, http: 409, retry: false, message: "Only a FAILED or DEAD job can be retried." }
  - { code: SHADOW_MODE, class: REQUEST, http: 409, retry: false, message: "The document was processed in shadow mode; its results cannot be published or used." }
  - { code: REVISION_CHANGED, class: REQUEST, http: 409, retry: false, message: "Someone else saved a review of this result. Reload and review again." }
  - { code: QUEUE_FULL, class: REQUEST, http: 429, retry: true, message: "Too many jobs are waiting. Try again later." }
  - { code: BATCH_TOO_LARGE, class: REQUEST, http: 400, retry: false, message: "The batch has too many items." }
  - { code: BUSY_RETRY, class: TRANSIENT, http: 503, retry: true, message: "The service is busy. Try again in a moment." }
  # --- security (no parsing; the DMS is asked to quarantine) ---
  - { code: TYPE_SPOOFED, class: SECURITY, http: null, retry: false, message: "The file is not what its name says. Upload the real file." }
  - { code: UNSAFE_CONTENT, class: SECURITY, http: null, retry: false, message: "The file was refused for safety. Upload a clean copy." }
  - { code: ENCRYPTED, class: SECURITY, http: null, retry: false, message: "The file is password-protected. Upload a copy without a password." }
  - { code: MACRO_PRESENT, class: SECURITY, http: null, retry: false, message: "The file contains macros. Save it without macros and upload again." }
  - { code: INTEGRITY_MISMATCH, class: SECURITY, http: 400, retry: false, message: "The stored file does not match its checksum. Support has been alerted." }
  # --- content (no retry; a person decides) ---
  - { code: NO_TEXT, class: CONTENT, http: null, retry: false, message: "No text could be read, even with OCR. Upload a clearer scan." }
  - { code: UNREADABLE_PAGES, class: QUALITY, http: null, retry: false, message: "Some pages could not be read; please read them and add the values." }
  - { code: REQUIRED_MISSING, class: QUALITY, http: null, retry: false, message: "Some details this document type usually shows were not found; please check." }
  - { code: CORRUPT, class: CONTENT, http: null, retry: false, message: "The file is damaged. Export or scan it again." }
  - { code: TOO_LARGE, class: CONTENT, http: null, retry: false, message: "The file is too large to read. Split it and upload the parts." }
  - { code: TYPE_MISMATCH, class: CONTENT, http: null, retry: false, message: "The file does not look like the type chosen. Check the type." }
  - { code: UNCERTAIN_TYPE, class: CONTENT, http: null, retry: false, message: "The document type is unclear. Please confirm it." }
  - { code: NOTHING_FOUND, class: CONTENT, http: null, retry: false, message: "Nothing was found in the document. Please check it." }
  - { code: CONTENT_FAILED, class: CONTENT, http: null, retry: false, message: "The document could not be processed; the job shows the reason." }
  - { code: LANGUAGE_NOT_READ, class: CONTENT, http: null, retry: false, message: "The document's language cannot be read automatically. Enter the values by hand." }
  # --- quality (field-level; job goes to review) ---
  - { code: LOW_CONFIDENCE, class: QUALITY, http: null, retry: false, message: "Confidence is low; please check this value." }
  - { code: RESULT_FORMAT, class: QUALITY, http: null, retry: false, message: "Part of this result does not follow the agreed format (result.json); DPS saved it and logged where." }
  - { code: MODELS_DISAGREE, class: QUALITY, http: null, retry: false, message: "The readers disagree; please choose the right value." }
  - { code: TYPE_DISPUTED, class: CONTENT, http: null, retry: false, message: "The rules and the Document Agent read different document types. Please confirm the type." }
  - { code: PERIOD_MISMATCH, class: QUALITY, http: null, retry: false, message: "The document is for a different period than the cycle expects." }
  - { code: BASIS_MISMATCH, class: QUALITY, http: null, retry: false, message: "The figures are consolidated where standalone is expected, or the other way round." }
  - { code: ENTITY_MISMATCH, class: QUALITY, http: null, retry: false, message: "The document is for a different legal entity than the cycle expects." }
  - { code: CURRENCY_MISMATCH, class: QUALITY, http: null, retry: false, message: "The document is in a different currency than the cycle expects." }
  - { code: UNITS_MISMATCH, class: QUALITY, http: null, retry: false, message: "The amounts are in different units than the cycle expects." }
  - { code: TAXONOMY_DEFAULT, class: QUALITY, http: null, retry: false, message: "Not stated in the document; the covenant taxonomy's usual value is suggested. Please confirm or correct it." }
  - { code: QUALIFIED, class: QUALITY, http: null, retry: false, message: "The covenant has a condition or exception; please check it applies as extracted." }
  - { code: WAIVER_TARGET_UNKNOWN, class: QUALITY, http: null, retry: false, message: "The waived covenant could not be matched to one approved covenant; please choose it." }
  - { code: WAIVER_PERIOD_UNKNOWN, class: QUALITY, http: null, retry: false, message: "No test date or period was found for the waiver; please set it." }
  - { code: BASE_MISSING, class: QUALITY, http: null, retry: false, message: "No approved covenants were sent, so the waived covenants could not be matched; please match them." }
  - { code: RESTATES, class: QUALITY, http: null, retry: false, message: "An amended and restated agreement: once approved, its covenants replace those of the earlier agreement." }
  - { code: SET_INCOMPLETE, class: QUALITY, http: null, retry: false, message: "Some documents of the set have no DPS result yet; extract them, then reconcile again." }
  - { code: SET_CHANGE_HELD, class: QUALITY, http: null, retry: false, message: "A change in the set was not applied because its target or terms are not settled; please apply it by hand." }
  - { code: SET_MANIFEST_INVALID, class: CONTENT, http: null, retry: false, message: "The document set manifest is not valid; please correct it and submit again." }
  - { code: OPERATOR_UNEXPECTED, class: QUALITY, http: null, retry: false, message: "The operator is unusual for this covenant (a coverage ratio is usually a minimum, a leverage ratio a maximum); please check it." }
  - { code: CONDITIONAL, class: QUALITY, http: null, retry: false, message: "The covenant applies only when its condition is met (for example a springing covenant); please check the condition." }
  - { code: SCOPE_UNKNOWN, class: QUALITY, http: null, retry: false, message: "The clause does not say whose figures are tested; please set the company." }
  - { code: SCOPE_SEVERAL, class: QUALITY, http: null, retry: false, message: "The clause binds several companies; split it if their figures are tested separately." }
  - { code: UNRESOLVED_REFERENCE, class: QUALITY, http: null, retry: false, message: "The covenant refers to a clause or schedule that was not found in this document." }
  - { code: UNRESOLVED_CANDIDATE, class: QUALITY, http: null, retry: false, message: "A duty sentence no extracted covenant explains; please confirm or dismiss it." }
  - { code: NUMBER_NOT_IN_QUOTE, class: QUALITY, http: null, retry: false, message: "The threshold is not written in the quoted text; please check the source." }
  - { code: RESIDUAL_BUDGET, class: QUALITY, http: null, retry: false, message: "Some unexplained duty sentences were not read again within the budget; they are listed for review." }
  - { code: RESIDUAL_INCOMPLETE, class: QUALITY, http: null, retry: false, message: "A second read of unexplained duty sentences failed; they are listed for review." }
  - { code: PROMPT_LIMIT, class: QUALITY, http: null, retry: false, message: "Some pages did not fit in the agent's prompt; its tools could still open them." }
  - { code: LINES_NOT_FOUND, class: QUALITY, http: null, retry: false, message: "Statement lines the reader did not find; listed so none is missing silently." }
  - { code: TOKEN_BUDGET_HIGH, class: QUALITY, http: null, retry: false, message: "The job used most of its token budget; a longer document of this kind may not be read in full." }
  - { code: AI_READ_DIFFERENT, class: QUALITY, http: null, retry: false, message: "The AI reader read another number for this covenant than the rules; please check the source." }
  - { code: AI_RESIDUAL, class: QUALITY, http: null, retry: false, message: "Found by the Document Agent's second read of a duty no covenant explained; please confirm it." }
  - { code: AMBIGUOUS_AMENDMENT_TARGET, class: QUALITY, http: null, retry: false, message: "The amendment change has no unique approved covenant it applies to; please pick the target." }
  - { code: AMOUNT_CURRENCY_DIFFERS, class: QUALITY, http: null, retry: false, message: "The limit is in a different currency than the loan; please confirm the conversion." }
  - { code: AMOUNT_SCALE_UNCLEAR, class: QUALITY, http: null, retry: false, message: "No scale (thousand, lakh, crore, million) is stated for the amount; please confirm it." }
  - { code: BASE_FROM_DPS, class: QUALITY, http: null, retry: false, message: "Compared with DPS's earlier extraction, not the approved covenants; send baseCovenants." }
  - { code: BASE_UNKNOWN, class: QUALITY, http: null, retry: false, message: "The amended agreement's covenants were not found; please check the base." }
  - { code: CHANGED_TWICE, class: QUALITY, http: null, retry: false, message: "The amendment changes this covenant more than once; please check which change applies." }
  - { code: CLAUSE_NOT_IN_BASE, class: QUALITY, http: null, retry: false, message: "The amendment refers to a clause that is not in the amended agreement." }
  - { code: CURRENCY_DIFFERS, class: QUALITY, http: null, retry: false, message: "The statement's currency differs from the loan's; figures were converted, please confirm." }
  - { code: CURRENCY_MIXED, class: QUALITY, http: null, retry: false, message: "The statement shows amounts in more than one currency; please confirm which applies." }
  - { code: DEBT_DOES_NOT_ADD_UP, class: QUALITY, http: null, retry: false, message: "Short-term and long-term debt do not add up to total debt." }
  - { code: DEFINITION_DIFFERS, class: QUALITY, http: null, retry: false, message: "The agreement defines this input with adjustments; the reported figure may not match the definition." }
  - { code: DIRECTION_MISMATCH, class: QUALITY, http: null, retry: false, message: "The operator contradicts the clause wording (floor or ceiling); please check it." }
  - { code: FORMULA_INVALID, class: QUALITY, http: null, retry: false, message: "Core rejected the covenant formula; please correct it." }
  - { code: INTEREST_IS_NET, class: QUALITY, http: null, retry: false, message: "Interest is shown net of income; the covenant may need gross interest." }
  - { code: LABEL_MEMORY_CONFLICT, class: QUALITY, http: null, retry: false, message: "A line was confirmed earlier as another item for this borrower; please check which is right." }
  - { code: LOANS_DIFFER, class: QUALITY, http: null, retry: false, message: "The borrower's loans are in different currencies; please confirm the currency used." }
  - { code: LOAN_CURRENCY_UNKNOWN, class: QUALITY, http: null, retry: false, message: "The loan's currency is not known; set it in the borrower's settings." }
  - { code: LOW_OCR_QUALITY, class: QUALITY, http: null, retry: false, message: "Scanned pages were read with low OCR confidence; please check the figures." }
  - { code: MISSING_LINE_ITEMS, class: QUALITY, http: null, retry: false, message: "Lines the covenants need (EBITDA, total debt, net worth) were not found." }
  - { code: MORE_POSSIBLE_COVENANTS, class: QUALITY, http: null, retry: false, message: "More covenant-like sentences were found than are listed; open the document to see all." }
  - { code: NEGATIVE_VALUE, class: QUALITY, http: null, retry: false, message: "A figure that cannot be negative was read as negative; please check its sign." }
  - { code: NO_DECLARATION, class: QUALITY, http: null, retry: false, message: "The certificate has no complied or not-complied wording for this covenant." }
  - { code: NUMBER_STYLE_UNCLEAR, class: QUALITY, http: null, retry: false, message: "The statement writes numbers in two styles; please confirm the decimal separator." }
  - { code: OUTSIDE_TENOR, class: QUALITY, http: null, retry: false, message: "A date falls after the end of the facility's tenor." }
  - { code: POSSIBLE_COVENANT_NOT_UNDERSTOOD, class: QUALITY, http: null, retry: false, message: "A sentence reads like a covenant the rules do not understand; please check it." }
  - { code: PROMPT_INJECTION_SUSPECTED, class: QUALITY, http: null, retry: false, message: "The document contains text addressed to an AI model; every proposal waits for a person." }
  - { code: RESTATED, class: QUALITY, http: null, retry: false, message: "This figure differs from the one approved earlier for the same period (restatement)." }
  - { code: SECOND_COVENANT_OF_FAMILY, class: QUALITY, http: null, retry: false, message: "A second covenant of the same family was found; check the formula measures this one." }
  - { code: SECOND_READER_DIFFERS, class: QUALITY, http: null, retry: false, message: "The AI checker read another figure than the rules; please check the source." }
  - { code: SECOND_READER_EMPTY, class: QUALITY, http: null, retry: false, message: "The AI checker read none of the figures; the statement waits for a person." }
  - { code: SEVERAL_LEVELS, class: QUALITY, http: null, retry: false, message: "The clause gives several levels for this covenant; please check which applies when." }
  - { code: SIGNATORY_MISSING, class: QUALITY, http: null, retry: false, message: "The certificate's signatory was not read." }
  - { code: STEP_DOWN, class: QUALITY, http: null, retry: false, message: "The covenant steps down over time; please check the levels and dates." }
  - { code: STEP_DOWN_ORDER, class: QUALITY, http: null, retry: false, message: "The step-down dates are not in order." }
  - { code: THRESHOLD_FROM_DEFINITION, class: QUALITY, http: null, retry: false, message: "The threshold comes from a defined term; please check the definition." }
  - { code: TYPE_NOT_ONBOARDING, class: QUALITY, http: null, retry: false, message: "The document is not an onboarding type (agreement, sanction letter, amendment)." }
  - { code: UDIN_MISSING, class: QUALITY, http: null, retry: false, message: "No valid UDIN was found on the certificate." }
  - { code: UNIT_NOT_STATED, class: QUALITY, http: null, retry: false, message: "The statement does not state its unit; amounts were read in the default unit, please confirm." }
  - { code: UNRESOLVED_AMENDMENT, class: QUALITY, http: null, retry: false, message: "The amendment change could not be matched to an approved covenant; please confirm it." }
  - { code: VERDICT_NOT_IN_RESULTS, class: QUALITY, http: null, retry: false, message: "The draft commentary states a verdict the results do not support; it was not used." }
  - { code: AI_ONLY, class: QUALITY, http: null, retry: false, message: "Only the Document Agent found this value; please confirm it." }
  - { code: SAME_SENTENCE, class: QUALITY, http: null, retry: false, message: "Several readings of the same sentence were merged into this value; the other codes are listed." }
  - { code: READ_FROM_IMAGE, class: QUALITY, http: null, retry: false, message: "This value was read from a page image; please confirm it." }
  - { code: NOT_GROUNDED, class: QUALITY, http: null, retry: false, message: "The value was not found on its page." }
  - { code: TOTALS_DO_NOT_ADD, class: QUALITY, http: null, retry: false, message: "The totals do not add up; please check the figures." }
  - { code: MAPPING_CONFLICT, class: QUALITY, http: null, retry: false, message: "The document names a different borrower or facility." }
  - { code: ENTITY_DIFFERS, class: QUALITY, http: null, retry: false, message: "The covenant is tested on a different basis than the statements." }
  # --- transient (retry with back-off, max 5 attempts) ---
  - { code: MODEL_TIMEOUT, class: TRANSIENT, http: null, retry: true, message: "Still processing." }
  - { code: MODEL_RATE_LIMITED, class: TRANSIENT, http: null, retry: true, message: "Still processing." }
  - { code: STORAGE_UNAVAILABLE, class: TRANSIENT, http: null, retry: true, message: "Still processing." }
  - { code: DB_DEADLOCK, class: TRANSIENT, http: null, retry: true, message: "Still processing." }
  - { code: SPRING_UNAVAILABLE, class: TRANSIENT, http: null, retry: true, message: "Still processing." }
  # --- degraded (continue without AI, every field to review) ---
  - { code: AI_UNAVAILABLE, class: DEGRADED, http: null, retry: false, message: "Read without the AI checker; please review." }
  - { code: AI_NOT_USED, class: DEGRADED, http: null, retry: false, message: "The Document Agent is switched off: read by the rules only, with no second reading or residual check; review every field." }
  - { code: LEASE_EXPIRED_EXHAUSTED, class: INTERNAL, http: null, retry: false, message: "The worker stopped during the last attempt; the job was set aside. Support can retry it." }
  - { code: FILE_FLAGS, class: QUALITY, http: null, retry: false, message: "The file has content a reviewer must know about (tracked changes, hidden sheets, a repaired PDF ...)." }
  - { code: STEP_TABLE, class: QUALITY, http: null, retry: false, message: "Levels were read from a table; check each date and level against the page." }
  - { code: DISMISSED_SAMPLE, class: QUALITY, http: null, retry: false, message: "A sampled sentence the Document Agent said is not a covenant; confirm or reject." }
  - { code: AI_DISMISSED, class: QUALITY, http: null, retry: false, message: "The Document Agent said these duty sentences are not covenants; a person confirms or rejects each." }
  - { code: FORMULA_TEMPLATE, class: QUALITY, http: null, retry: false, message: "The formula is DPS's standard template, not the agreement's own definition; confirm it against the defined terms." }
  - { code: AI_BUDGET_EXCEEDED, class: DEGRADED, http: null, retry: false, message: "Read without the AI checker; please review." }
  - { code: AI_MONTHLY_BUDGET_SPENT, class: DEGRADED, http: null, retry: false, message: "The month's AI token budget is spent: read without the AI checker; please review." }
  - { code: AI_REFUSED, class: DEGRADED, http: null, retry: false, message: "The AI model refused the request (content filter): read without the AI checker; please review." }
  - { code: AI_UNGROUNDED, class: DEGRADED, http: null, retry: false, message: "The AI answer quoted text that is not on the page and was dropped; please review." }
  - { code: PAGES_NOT_SENT, class: DEGRADED, http: null, retry: false, message: "Some pages with duty sentences did not fit the agent's prompt (it could still open them with its tools); please check them." }
  - { code: COVERAGE_GAP, class: DEGRADED, http: null, retry: false, message: "Some duty sentences on the covenant pages are not explained by any extracted covenant; please check them." }
  - { code: MODEL_OUTPUT_INVALID, class: DEGRADED, http: null, retry: false, message: "The AI answer was not usable; read by the rules only. Please review." }
  # --- resource ---
  - { code: PARSE_TIMEOUT, class: RESOURCE, http: null, retry: false, message: "The file is too large or complex. Split it and upload the parts." }
  - { code: OUT_OF_MEMORY, class: RESOURCE, http: null, retry: false, message: "The file is too large or complex. Split it and upload the parts." }
  - { code: PARSER_CRASH, class: RESOURCE, http: null, retry: false, message: "The file could not be read. Support has been informed." }
  - { code: OPERATOR_UNREAD, class: QUALITY, http: null, retry: false, message: "The reader wrote something that is not an operator; set it from the quote." }
  - { code: BREACH_WORDING, class: QUALITY, http: null, retry: false, message: "The clause states when the covenant is breached; the covenant is the opposite. Check the operator." }
  - { code: LIBRARY_AMBIGUOUS, class: QUALITY, http: null, retry: false, message: "Several library covenants fit this covenant equally; a person picks one." }
  - { code: PERIOD_FROM_DOCUMENT, class: QUALITY, http: null, retry: false, message: "No period date was sent; the period end was read from the statement's heading. Check it." }
  - { code: PERIOD_DATE_MISSING, class: QUALITY, http: null, retry: false, message: "No period date was sent and the statement names none; send it with reclassify (asOfDate) or the figures cannot be stored." }
  - { code: TYPE_NOT_READ, class: QUALITY, http: null, retry: false, message: "The document is of a type DPS does not read; reclassify it if the type is wrong." }
  - { code: AI_DAILY_BUDGET_SPENT, class: DEGRADED, http: null, retry: false, message: "The day's AI token budget is spent; read by the rules only until tomorrow (UTC)." }
  # --- internal ---
  - { code: INTERNAL_ERROR, class: INTERNAL, http: 500, retry: true, message: "Processing failed; support has been informed." }
