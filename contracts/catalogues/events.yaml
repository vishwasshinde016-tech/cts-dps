# DPS event catalogue (contract-v1). Events are read from GET /dps/v1/events?after=<cursor>.
# Ordering: by seq (outbox sequence). Delivery: at least once; de-duplicate on eventId.
# Every event uses the envelope in schemas/event.json; payloads never hold document content.
# New payloads carry schemaVersion, pipelineVersion when the job has one, and runId when tied to a saved result.
version: 1.0.0
events:
  - type: dps.job.accepted
    when: A job was created (POST /jobs or a batch item).
    payload: { schemaVersion: string, pipelineVersion: string, jobType: string, priority: string, batchId: "string|null" }
  - type: dps.analysis.completed
    when: An ANALYZE job finished (phase 3).
    payload: { schemaVersion: string, pipelineVersion: string, runId: string, type: string, confidence: number, mismatch: boolean, uncertain: boolean, expected: "string|null",
               identifiers: array, legibility: number, missingRequired: "string|null", keyPages: array,
               mismatches: array, route: string, resultUrl: string }
  - type: dps.extraction.completed
    when: An extraction finished with every field accepted, or after its review was submitted.
    payload: { schemaVersion: string, pipelineVersion: string, runId: string, skillPack: string, fields: integer, toReview: integer, route: "string|null", documentType: "string|null", resultUrl: string, revision: integer, reviewedBy: string, closed: boolean, notUsed: integer }
    notes: skillPack and fields when the extraction itself finished; revision and reviewedBy when a review completed it.
  - type: dps.extraction.needs_review
    when: An extraction finished with at least one field for a person.
    payload: { schemaVersion: string, pipelineVersion: string, runId: string, skillPack: string, fields: integer, toReview: integer, route: "string|null", documentType: "string|null", resultUrl: string }
    notes: GET /dps/v1/jobs/{jobId}/review lists the fields; the job's errorCode is MAPPING_REVIEW when the borrower or facility must be mapped first.
  - type: dps.extraction.shadow
    when: A job run in SHADOW rollout (phase 7 pilot) finished; the result is stored for comparison, not shown.
    payload: { schemaVersion: string, pipelineVersion: string, runId: string, skillPack: string, fields: integer, resultUrl: string }
  - type: dps.job.failed
    when: A job ended with a deterministic failure (no retry).
    payload: { schemaVersion: string, pipelineVersion: string, errorCode: string, message: string, quarantine: boolean }
    notes: quarantine is true when inspection found an unsafe or spoofed file; the DMS quarantines that version.
  - type: dps.job.dead
    when: A job used up its retries, crashed the worker twice, or hit INTERNAL_ERROR twice. Ops are alerted.
    payload: { schemaVersion: string, pipelineVersion: string, errorCode: string, message: string, attempts: integer }
  - type: dps.job.cancelled
    when: A job was cancelled before it finished.
    payload: { schemaVersion: string, pipelineVersion: string, cancelledBy: string, cancelled: boolean, errorCode: string, message: string }
    notes: cancelledBy when it was cancelled while waiting; cancelled true when it was cancelled while running.
  - type: dps.job.retry_wait
    when: A temporary problem (Spring or the model unreachable, a parser hiccup); DPS tries again at dueAt.
    payload: { schemaVersion: string, pipelineVersion: string, errorCode: string, attempts: integer, dueAt: string }
  - type: dps.job.moved
    when: The job moved to the HEAVY pool (a long or poorly scanned document); it waits for a HEAVY worker.
    payload: { schemaVersion: string, pipelineVersion: string, pool: string }
  - type: dps.job.requeued
    when: Support put a FAILED or DEAD job back in the queue (retry, batch re-run); it may still complete.
    payload: { schemaVersion: string, pipelineVersion: string, requeuedBy: string, previousStatus: string }
  - type: dps.job.superseded
    when: The document was read again as another type (reclassify); this job ends, supersededBy carries the result.
    payload: { schemaVersion: string, pipelineVersion: string, supersededBy: string, status: string }
  - type: dps.batch.completed
    when: Every item of a batch has ended.
    payload: { schemaVersion: string, batchId: string, counts: object, errorsUrl: "string|null" }
