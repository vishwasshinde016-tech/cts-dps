<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPS Flow Explained</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#1b1f24;--muted:#5b6470;--line:#d9dee5;--accent:#0f766e;
  --t-external:#64748b;--t-backend:#0f766e;--t-security:#be123c;--t-database:#6d28d9;--t-messagebus:#b45309;--t-cloud:#1d4ed8;
  --chip:#eef1f4;--sel:#fff7d6;--code:#f1f3f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4b1;--line:#2a313b;--accent:#2dd4bf;
  --t-external:#94a3b8;--t-backend:#2dd4bf;--t-security:#fb7185;--t-database:#a78bfa;--t-messagebus:#fbbf24;--t-cloud:#60a5fa;
  --chip:#222831;--sel:#3a3416;--code:#1f252d;}}
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4b1;--line:#2a313b;--accent:#2dd4bf;
  --t-external:#94a3b8;--t-backend:#2dd4bf;--t-security:#fb7185;--t-database:#a78bfa;--t-messagebus:#fbbf24;--t-cloud:#60a5fa;
  --chip:#222831;--sel:#3a3416;--code:#1f252d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:13px;color:var(--muted)}
input[type=text]{font:13px ui-monospace,Consolas,monospace;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:170px}
button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
.help{font-size:13px;color:var(--muted);margin:6px 0 0}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}#detail{position:static;max-height:none}}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.lane h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.blk{flex:0 1 auto;min-width:120px;max-width:200px;text-align:left;padding:7px 9px;border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:8px;background:var(--panel);cursor:pointer}
.blk b{display:block;font-size:13px;line-height:1.25}
.blk span{display:block;font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:2px;word-break:break-all}
.blk.sel{background:var(--sel);border-color:var(--c)}
.arrow{display:flex;align-items:center;color:var(--muted);font-size:12px;gap:2px;white-space:nowrap}
.arrow i{font-style:normal;font-size:16px}
.down{text-align:center;color:var(--muted);font-size:18px;margin:-6px 0 6px}
#detail{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 136px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
#detail h3{margin:0 0 2px;font-size:18px}
#detail .stage{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
#detail h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
#detail p{margin:0}
.say{border-left:3px solid var(--accent);padding:4px 10px;background:var(--chip);border-radius:4px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.src{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--code)}
.src .lbl{font-size:13px;font-weight:600}
.src code{display:block;font:12px ui-monospace,Consolas,monospace;word-break:break-all;margin:3px 0 6px;color:var(--ink)}
.src a,.src button{font-size:12px;margin-right:6px}
.src a{display:inline-block;padding:4px 9px;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none}
.nav{display:flex;gap:8px;margin-top:14px}
.type{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--c);color:var(--c);margin-left:6px;vertical-align:middle}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>DPS flow explained: every block, what it does, and its code</h1>
    <div class="controls">
      <label for="root">Repository folder</label>
      <input type="text" id="root" value="C:\cts-dps" spellcheck="false" aria-label="Repository folder on this laptop">
      <button id="prev" title="Previous block (left arrow)">◀ Previous</button>
      <button id="next" title="Next block (right arrow)">Next ▶</button>
      <button id="theme" title="Light or dark">◐</button>
    </div>
  </div>
  <p class="help">Click a block to see what it does, what to say, and its code. <b>Open in VS Code</b> opens the file on this laptop at that line. Set the repository folder first: <code>C:\cts-dps</code> on the office laptop. Use <kbd>←</kbd> <kbd>→</kbd> to walk the flow block by block.</p>
</header>
<main>
  <div id="flow"></div>
  <aside id="detail" aria-live="polite"></aside>
</main>
<script>
const DATA = {"rev": "2915c40ffd1182e3fb60dac0e261ff76d9d416a4", "lanes": [{"id": "l0", "label": "0 · Contracts and schemas (contracts/, skills/)", "blocks": [{"id": "c_api", "label": "Job API contract", "sub": "contracts/dps-jobs-api.yaml:32", "type": "external", "does": "The contract between Spring and DPS. It lists every endpoint Spring may call: submit a job, read its status, pull its result, read events. Both teams build against this file, so neither side guesses.", "say": "This is the agreement between the two teams: every call Spring makes to DPS is defined here.", "data": "", "sources": [{"path": "contracts/dps-jobs-api.yaml", "line": 32, "end": 98, "label": "POST /dps/v1/jobs"}, {"path": "contracts/dps-jobs-api.yaml", "line": 99, "end": 132, "label": "GET /dps/v1/jobs/{id}/result"}, {"path": "contracts/dps-jobs-api.yaml", "line": 333, "end": 360, "label": "GET /dps/v1/events"}], "arrow": "", "linked": false, "note": ""}, {"id": "c_request", "label": "Caller schema", "sub": "contracts/schemas/job-request.json", "type": "backend", "does": "The caller schema: the exact JSON Spring must send to start a job. jobType says what to do, document says where the file is (object key, SHA-256, name, type, size), context says who it belongs to (tenant, CP, borrower, facility, the type the user chose). The Python class JobRequest enforces the same rules and rejects unknown or missing fields.", "say": "Spring must send exactly this shape; anything else is refused with a clear error.", "data": "", "sources": [{"path": "contracts/schemas/job-request.json", "line": 1, "end": 327, "label": "job request: jobType, document, context"}, {"path": "contracts/schemas/job-request.json", "line": 91, "end": null, "label": "context: CP, borrower, facility IDs"}, {"path": "dps/src/dps/api/jobs.py", "line": 114, "end": 119, "label": "JobRequest: the same, in Python"}], "arrow": "", "linked": false, "note": ""}, {"id": "c_page", "label": "Page model schema", "sub": "contracts/schemas/page-model.json", "type": "backend", "does": "The page model schema: what extraction produces. For every page it holds the text, each line with its position on the page, tables and an OCR quality score. Every later step reads this, never the raw file.", "say": "This is the parsed document every later step works from.", "data": "derived/ folder, dps_artifact table", "sources": [{"path": "contracts/schemas/page-model.json", "line": 1, "end": 338, "label": "parsed document: pages, blocks, boxes"}, {"path": "contracts/schemas/page-model.json", "line": 212, "end": null, "label": "pages"}], "arrow": "", "linked": false, "note": ""}, {"id": "c_skill", "label": "Skill answer schema", "sub": "skills/covenants/schema.json", "type": "backend", "does": "The skill pack for covenants. schema.json is the exact JSON the agent must return (each item: name, value, page, quote). prompt.md is the instruction the agent gets. pack.yaml sets which tools it may use, how many pages, and the limits.", "say": "The skill tells the agent what to do, what shape to answer in, and what it may use.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/schema.json", "line": 1, "end": 8, "label": "what the agent must return"}, {"path": "dps/src/dps/skills/covenants/prompt.md", "line": 1, "end": 16, "label": "the skill's instructions"}, {"path": "dps/src/dps/skills/covenants/pack.yaml", "line": 1, "end": 17, "label": "tools, pages, limits"}], "arrow": "", "linked": false, "note": ""}, {"id": "c_result", "label": "Extraction (result) schema", "sub": "contracts/schemas/result.json:82", "type": "backend", "does": "The extraction (result) schema, dps.result/1.0: what Spring receives. Each field carries its value (metric, operator, threshold, unit), its source (page, exact quote, box), how it was found, a confidence, issues and a status. classification and document (route, coverage, page counts) describe the whole document.", "say": "This is the output Spring gets: every value with its page and sentence as evidence.", "data": "dps_run table", "sources": [{"path": "contracts/schemas/result.json", "line": 82, "end": null, "label": "field: value, source, method, status"}, {"path": "contracts/schemas/result.json", "line": 924, "end": null, "label": "classification"}, {"path": "contracts/schemas/result.json", "line": 1040, "end": null, "label": "document: route, coverage, pages"}], "arrow": "", "linked": false, "note": ""}, {"id": "c_event", "label": "Event schema", "sub": "contracts/schemas/event.json", "type": "backend", "does": "The event schema: the small messages Spring reads from GET /dps/v1/events (accepted, needs review, failed, dead). errors.yaml lists every issue and error code a result can carry, and a test keeps it complete.", "say": "Spring learns about progress from these events, in order.", "data": "dps_event_feed table", "sources": [{"path": "contracts/schemas/event.json", "line": 1, "end": 24, "label": "event Spring reads"}, {"path": "contracts/catalogues/errors.yaml", "line": 1, "end": null, "label": "every issue code"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l1", "label": "1 · Spring sends the job (api/jobs.py)", "blocks": [{"id": "spring", "label": "Spring app", "sub": "POST /dps/v1/jobs", "type": "external", "does": "Outside DPS. The RM uploads the document in the CTS screen, Spring stores it in the DMS (one fixed copy per version) and calls POST /dps/v1/jobs with the file reference and the context.", "say": "Everything starts when Spring sends DPS a job; DPS never receives uploads directly.", "data": "DMS store (file)", "sources": [{"path": "contracts/dps-jobs-api.yaml", "line": 32, "end": null, "label": "job API contract"}], "arrow": "", "linked": true, "note": ""}, {"id": "submit", "label": "submit_job", "sub": "api/jobs.py:312", "type": "backend", "does": "The entry point of DPS. FastAPI turns the request body into JobRequest; a wrong shape is refused before any code runs. It then calls validation, the duplicate check and job creation, and answers 202 at once.", "say": "Every document enters DPS through this one function.", "data": "", "sources": [{"path": "dps/src/dps/api/jobs.py", "line": 311, "end": 348, "label": "submit_job: POST /dps/v1/jobs"}, {"path": "dps/src/dps/api/jobs.py", "line": 114, "end": 119, "label": "JobRequest: what Spring sends"}, {"path": "contracts/schemas/job-request.json", "line": 1, "end": 327, "label": "caller schema"}], "arrow": "", "linked": true, "note": ""}, {"id": "validate", "label": "validate_job", "sub": "api/jobs.py:166 · SHA-256", "type": "security", "does": "Checks the job type is allowed for this caller and the file format is supported. It opens the stored file and recomputes its SHA-256: if the bytes are not exactly what Spring described, the job is refused.", "say": "DPS proves the file is the right, unchanged version before accepting the job.", "data": "", "sources": [{"path": "dps/src/dps/api/jobs.py", "line": 166, "end": 217, "label": "validate_job: fields + file SHA-256"}], "arrow": "", "linked": true, "note": ""}, {"id": "dup", "label": "Already in DPS?", "sub": "_input_key · api/jobs.py:268", "type": "backend", "does": "Builds a key from the document, its context and the pipeline version. If a job with that key already exists (queued, running or finished), DPS returns that job with duplicate: true instead of making a second one.", "say": "This is the board's 'extraction in progress' box: the same document is never read twice.", "data": "", "sources": [{"path": "dps/src/dps/api/jobs.py", "line": 268, "end": 278, "label": "_input_key: duplicate key"}], "arrow": "no", "linked": true, "note": "yes: returns the same job to Spring (duplicate: true)"}, {"id": "create", "label": "create_job", "sub": "api/jobs.py:240 · dps_job", "type": "database", "does": "Inserts one row in dps_job with status QUEUED and a row in dps_document, and writes the event dps.job.accepted in the same database transaction. Then DPS replies 202 Accepted with the jobId.", "say": "The job is now safely queued; Spring gets its job ID immediately.", "data": "dps_job, dps_document, dps_event_feed", "sources": [{"path": "dps/src/dps/api/jobs.py", "line": 240, "end": 261, "label": "create_job: dps_job row + event"}, {"path": "dps/src/dps/models.py", "line": 128, "end": 178, "label": "Job table (dps_job)"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l2", "label": "2 · Queue + Python worker (jobs.py, worker.py)", "blocks": [{"id": "runonce", "label": "Worker.run_once", "sub": "worker.py:131 · every 2 s", "type": "backend", "does": "The Python worker's loop. Each turn it asks the queue for one job; if there is none it sleeps 2 seconds and asks again. Several workers can run side by side.", "say": "This is the architect's 'Python worker polls the job table'.", "data": "", "sources": [{"path": "dps/src/dps/worker.py", "line": 131, "end": 147, "label": "run_once: poll the queue"}], "arrow": "", "linked": true, "note": ""}, {"id": "claim", "label": "claim (atomic)", "sub": "jobs.py:85", "type": "database", "does": "Takes one job with a single UPDATE: set RUNNING and owner = me, only if it is still QUEUED. Only one worker's update can succeed, so a job is never processed twice. One row is added to dps_job_attempt.", "say": "Two workers can never take the same job.", "data": "dps_job (RUNNING), dps_job_attempt", "sources": [{"path": "dps/src/dps/jobs.py", "line": 85, "end": 129, "label": "claim: compare-and-set"}], "arrow": "", "linked": true, "note": ""}, {"id": "lease", "label": "lease + attempt fence", "sub": "jobs.py:162 · :54", "type": "security", "does": "While working, a heartbeat renews the job's lease (locked_until). If the worker dies, the lease expires and another worker claims the job. Every write checks the attempt number, so the dead worker's late writes are rejected (LeaseLost).", "say": "A crash never loses a job and never lets an old worker overwrite a result.", "data": "", "sources": [{"path": "dps/src/dps/jobs.py", "line": 162, "end": 176, "label": "renew_lease: heartbeat"}, {"path": "dps/src/dps/jobs.py", "line": 54, "end": 70, "label": "guard_attempt: stale worker blocked"}], "arrow": "", "linked": true, "note": ""}, {"id": "route", "label": "_run: route by flow", "sub": "worker.py:211", "type": "backend", "does": "Sends the job to the right path for its job type: SKILL_PACK (onboard, amendment, sanction, certificate), AGREEMENT_INTAKE, STATEMENT_PROCESSING or ANALYZE. The mapping is JOB_TYPES in api/jobs.py.", "say": "Each job type has its own flow; here the worker picks it.", "data": "", "sources": [{"path": "dps/src/dps/worker.py", "line": 211, "end": 270, "label": "_run: route by flow"}, {"path": "dps/src/dps/api/jobs.py", "line": 38, "end": 49, "label": "JOB_TYPES: job type to flow"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l3", "label": "3 · Extraction: file to page model (ingest/, parse/)", "blocks": [{"id": "read", "label": "read + SHA-256", "sub": "ingest/pipeline.py:48", "type": "backend", "does": "Fetches the exact file version from the DMS store by its object key and checks the SHA-256 again. A file that changed since submission is refused.", "say": "DPS reads only the exact version Spring pointed at.", "data": "", "sources": [{"path": "dps/src/dps/worker.py", "line": 330, "end": 359, "label": "_ingest"}, {"path": "dps/src/dps/ingest/pipeline.py", "line": 48, "end": 54, "label": "read: DMS version + hash"}], "arrow": "", "linked": true, "note": ""}, {"id": "inspect", "label": "inspect file", "sub": "ingest/inspect.py:63", "type": "security", "does": "File validation. It reads the real type from the first bytes, not the file name: %PDF is a PDF, a zip is Word or Excel, OLE is old Excel. A name that lies is TYPE_SPOOFED. It refuses encrypted files, macros, PDF JavaScript or embedded files, and checks the limits: 500 pages, zip bombs, very large CSVs. Refused files are quarantined.", "say": "Unsafe or disguised files are stopped here and never opened.", "data": "", "sources": [{"path": "dps/src/dps/ingest/inspect.py", "line": 63, "end": 69, "label": "inspect: real type, encrypted, macros, zip bombs"}], "arrow": "safe", "linked": true, "note": ""}, {"id": "sandbox", "label": "sandbox parse", "sub": "parse/sandbox.py:157", "type": "security", "does": "Parsing runs in a separate child process with CPU, memory and time limits and no network. If a file crashes or hangs the parser, only that process dies; repeated crashes mark the job DEAD.", "say": "Even a malicious PDF cannot reach anything.", "data": "", "sources": [{"path": "dps/src/dps/parse/sandbox.py", "line": 157, "end": 186, "label": "run: child process, no network"}], "arrow": "", "linked": true, "note": ""}, {"id": "build", "label": "page_model.build", "sub": "parse/page_model.py:30", "type": "backend", "does": "Chooses the reader by format: PDF, Excel (.xlsx with openpyxl, .xls with xlrd), CSV or Word (python-docx). It produces the page model: per page the text, each line with its position, tables. A bundled PDF is split into its documents (segment).", "say": "Every format becomes the same page model.", "data": "", "sources": [{"path": "dps/src/dps/parse/page_model.py", "line": 30, "end": 48, "label": "build: PDF / Excel / Word / CSV"}, {"path": "dps/src/dps/parse/segment.py", "line": 46, "end": 66, "label": "segment: split bundles"}], "arrow": "", "linked": true, "note": ""}, {"id": "engine", "label": "pypdf, pdfplumber, RapidOCR", "sub": "parse/engine.py:127 · :71", "type": "backend", "does": "For PDFs: pypdf reads the text layer and pdfplumber records where every line sits, so the reviewer can see the exact spot. A page with under 40 characters of text is a scan: pypdfium2 draws it and RapidOCR reads it on this machine. Many poor pages go to Docling in the heavy pool.", "say": "Text and positions from every page; scans are read locally, never by a cloud OCR.", "data": "", "sources": [{"path": "dps/src/dps/parse/engine.py", "line": 127, "end": 164, "label": "ParserEngine: text + positions"}, {"path": "dps/src/dps/parse/engine.py", "line": 71, "end": 124, "label": "RapidOcrBackend: local OCR"}, {"path": "dps/src/dps/parse/engine.py", "line": 207, "end": 231, "label": "HeavyEngine: Docling"}], "arrow": "", "linked": true, "note": ""}, {"id": "derived", "label": "page model saved", "sub": "derived/ · dps_artifact", "type": "database", "does": "The page model is saved once (write-once) under derived/<tenant>/<version>/page-model/ and listed in dps_artifact. If the same bytes come again, it is reused instead of parsed again. The original file is never changed.", "say": "The extracted text is stored once and reused.", "data": "derived/ folder, dps_artifact", "sources": [{"path": "dps/src/dps/ingest/pipeline.py", "line": 56, "end": 84, "label": "page_model: write once, reuse"}, {"path": "dps/src/dps/models.py", "line": 245, "end": 264, "label": "Artifact table (dps_artifact)"}, {"path": "contracts/schemas/page-model.json", "line": 1, "end": 338, "label": "page model schema"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l4", "label": "4 · Detect the document type (flows/, analyze/)", "blocks": [{"id": "flow", "label": "SkillJobFlow (CrewAI)", "sub": "flows/skill_job.py:27", "type": "backend", "does": "Starts the job's own CrewAI Flow, the architect's 'own context per job'. The Flow runs the skill steps and saves its state after each step, so a job can resume after a review.", "say": "Each job runs in its own CrewAI Flow.", "data": "dps_flow_state", "sources": [{"path": "dps/src/dps/flows/skill_job.py", "line": 27, "end": 49, "label": "SkillJobFlow: one Flow per job"}], "arrow": "", "linked": true, "note": ""}, {"id": "signals", "label": "rule_scores", "sub": "analyze/classify.py:134", "type": "backend", "does": "Scores the first 2 pages for each document type using SIGNALS, phrases with weights. Loan agreement: 'Facility Agreement', '(the Borrower)', 'Event of Default'. Sanction letter: 'has been sanctioned', 'Dear Sir'. Amendment: 'Amendment to ... Agreement', 'shall be deleted and replaced'. Statement: 'Balance Sheet as at'. Certificate: 'Compliance Certificate', UDIN. Many 'shall' sentences add to agreement; a strong amendment score lowers agreement.", "say": "DPS detects the type from the words a document of that type always uses.", "data": "", "sources": [{"path": "dps/src/dps/analyze/classify.py", "line": 25, "end": 90, "label": "SIGNALS: phrases per type"}, {"path": "dps/src/dps/analyze/classify.py", "line": 134, "end": 164, "label": "rule_scores: first 2 pages"}], "arrow": "", "linked": true, "note": ""}, {"id": "sure", "label": "Rules sure?", "sub": "decide_rules · classify.py:193", "type": "backend", "does": "Decision: the top type is accepted only if it scores 0.8 or more and leads the next type by 0.3. Yes: the type is decided by rules. No: the agent is asked.", "say": "Rules decide when they are clearly sure.", "data": "", "sources": [{"path": "dps/src/dps/analyze/classify.py", "line": 193, "end": 198, "label": "decide_rules: score >= 0.8, lead >= 0.3"}, {"path": "dps/src/dps/analyze/classify.py", "line": 20, "end": null, "label": "DECIDE_SCORE, DECIDE_LEAD"}], "arrow": "no", "linked": true, "note": "no: ask the agent (next block) · yes: skip straight to 'classify: type found'"}, {"id": "aiclass", "label": "Agent second opinion", "sub": "model_classify · classify.py:238", "type": "backend", "does": "Only when the rules are unsure. The agent reads the first pages and answers with a type plus 2-3 quoted lines. The quotes are checked against the page text; an answer without real quotes is ignored.", "say": "The agent helps only when needed, and must prove its answer with quotes.", "data": "dps_ai_call", "sources": [{"path": "dps/src/dps/analyze/classify.py", "line": 238, "end": 259, "label": "model_classify: agent with quotes"}, {"path": "dps/src/dps/analyze/classify.py", "line": 229, "end": 235, "label": "grounded: quotes on page"}], "arrow": "", "linked": true, "note": ""}, {"id": "classify", "label": "classify: type found", "sub": "analyze/classify.py:294", "type": "backend", "does": "The classification result: type, confidence, method (rules or model) and evidence. It is compared with the type the user chose; a difference raises TYPE_MISMATCH. A document that is not for onboarding raises TYPE_NOT_ONBOARDING.", "say": "We now know what the document is, and whether the user picked the right type.", "data": "", "sources": [{"path": "dps/src/dps/analyze/classify.py", "line": 294, "end": 334, "label": "classify: entry, TYPE_MISMATCH"}], "arrow": "", "linked": true, "note": ""}, {"id": "identify", "label": "identify + match IDs", "sub": "analyze/identify.py:153", "type": "backend", "does": "Finds identifiers in the document: PAN, CIN, GSTIN, loan account, period end, currency and units. match checks them against Spring's records through lookup_identifier; conflicts go to review.", "say": "DPS checks the document really belongs to this borrower and facility.", "data": "", "sources": [{"path": "dps/src/dps/analyze/identify.py", "line": 153, "end": 214, "label": "find_identifiers: PAN, CIN, account, period"}, {"path": "dps/src/dps/analyze/identify.py", "line": 271, "end": 290, "label": "match: check IDs in Spring"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l5", "label": "5 · Pick the skill (skills/runner.py, pack.yaml)", "blocks": [{"id": "packs", "label": "ONBOARD_PACKS", "sub": "skills/runner.py:608", "type": "backend", "does": "Maps the detected type to a skill pack: LOAN_AGREEMENT to covenants, SANCTION_LETTER to sanction, AMENDMENT to amendment_diff. Other job types (for example EXTRACT_CERTIFICATE) use for_job_type, which picks the pack whose pack.yaml lists that job.", "say": "The type decides which skill the agent will use.", "data": "", "sources": [{"path": "dps/src/dps/skills/runner.py", "line": 608, "end": null, "label": "type to skill pack"}, {"path": "dps/src/dps/skills/runner.py", "line": 611, "end": 661, "label": "run_onboard"}, {"path": "dps/src/dps/skills/__init__.py", "line": 80, "end": 85, "label": "for_job_type: other job types"}], "arrow": "", "linked": true, "note": ""}, {"id": "pack", "label": "skill pack", "sub": "skills/covenants/pack.yaml", "type": "backend", "does": "The skill's settings: model route (strong, vision for images), the 5 tools it may use, up to 4 reads of 25 pages, limits of 8 tool calls, 3 turns, 240 seconds and 400,000 tokens, and how risky each field is (which fields always need a person).", "say": "The skill sets what the agent may use and how much.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/pack.yaml", "line": 1, "end": 17, "label": "tools, pages, limits, risk"}], "arrow": "", "linked": true, "note": ""}, {"id": "prompt_md", "label": "prompt.md + schema.json", "sub": "skills/covenants/", "type": "backend", "does": "prompt.md is the instruction for this skill; schema.json is the exact answer shape. Together with rules.py (no-AI rules) and pack.yaml they make one skill. Same agent, different skill per document type.", "say": "This is the architect's 'one agent, many skills'.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/schema.json", "line": 1, "end": null, "label": "answer schema the agent must return"}], "arrow": "", "linked": true, "note": ""}, {"id": "extract", "label": "_extract: the order", "sub": "skills/runner.py:391", "type": "backend", "does": "_extract runs the skill in a fixed order: rules, page finder, agent reads, grounding, vote, ledger and second read, Java check, codes, scoring. run around it adds the per-job token budget and the final checks. If the model fails, the job falls back to rules and does not fail.", "say": "The whole extraction order is in this one function.", "data": "", "sources": [{"path": "dps/src/dps/skills/runner.py", "line": 391, "end": 520, "label": "_extract: whole extraction order"}, {"path": "dps/src/dps/skills/runner.py", "line": 313, "end": 382, "label": "run: budget, score, checks"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l6", "label": "6 · Rules first, then the pages (skills/covenants/)", "blocks": [{"id": "rules", "label": "rules (no AI)", "sub": "skills/covenants/rules.py:61", "type": "backend", "does": "Reads the whole document with no AI: numbered clauses, ratio names (DSCR, leverage, ICR...), operators like 'not less than' or 'shall not exceed', thresholds and units. Fast, free and the same answer every time.", "say": "Rules go first and find the clearly written covenants.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/rules.py", "line": 61, "end": 69, "label": "rules: ratios, operators, thresholds"}], "arrow": "", "linked": true, "note": ""}, {"id": "duty", "label": "is_duty", "sub": "skills/covenants/pages.py:61", "type": "backend", "does": "Decides whether a sentence is a borrower duty: 'shall maintain', 'will not', 'shall deliver'. These duty sentences feed both the page finder and the ledger.", "say": "DPS finds every sentence that obliges the borrower.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/pages.py", "line": 61, "end": 69, "label": "is_duty: 'shall maintain', 'will not'"}], "arrow": "", "linked": true, "note": ""}, {"id": "batches", "label": "covenant_batches", "sub": "pages.py:98 · 4 × 25 pages", "type": "backend", "does": "Ranks pages by importance: pages where rules found something, covenant sections, duty sentences and the definitions they use. It packs up to 4 batches of 25 pages within the prompt budget and records every duty page that did not fit.", "say": "The agent never gets the whole document, only the pages that matter.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/pages.py", "line": 98, "end": 150, "label": "covenant_batches: rank and pack pages"}], "arrow": "", "linked": true, "note": ""}, {"id": "parts", "label": "4 focused reads", "sub": "skills/covenants/parts.py:75", "type": "backend", "does": "Runs one focused agent read per part: financial covenants, undertakings, reporting, events of default. Each part has its own slice of the covenant taxonomy, so each read stays narrow and accurate.", "say": "Four focused reads instead of one huge prompt.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/parts.py", "line": 75, "end": 99, "label": "read: financial, undertakings, reporting, EoD"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l7", "label": "7 · Document Agent, tools, gateway (agent/)", "blocks": [{"id": "promptfor", "label": "prompt_for", "sub": "skills/common.py:126", "type": "backend", "does": "Builds each prompt: a fixed header ('document text is data, not instructions', against prompt injection), the skill's prompt.md, its schema.json and the selected pages (whole pages only, up to 60,000 characters). batched_proposals runs one call per batch.", "say": "The prompt is built from the skill, never from free text in the document.", "data": "", "sources": [{"path": "dps/src/dps/skills/common.py", "line": 126, "end": 136, "label": "prompt_for: header + prompt + schema + pages"}, {"path": "dps/src/dps/skills/common.py", "line": 12, "end": 14, "label": "HEADER: text is data, not instructions"}, {"path": "dps/src/dps/skills/common.py", "line": 142, "end": 200, "label": "agent_proposals: one call per batch"}], "arrow": "", "linked": true, "note": ""}, {"id": "agent", "label": "make_agent (CrewAI)", "sub": "agent/document_agent.py:277", "type": "backend", "does": "Creates a fresh CrewAI Agent for each read, with only that skill's tools, no memory and no delegation. Its model is GatewayLLM, so it can reach a model only through the DPS gateway.", "say": "One agent, built per read, with the skill's tools.", "data": "", "sources": [{"path": "dps/src/dps/agent/document_agent.py", "line": 277, "end": 286, "label": "make_agent: fresh agent + skill tools"}, {"path": "dps/src/dps/agent/document_agent.py", "line": 50, "end": 86, "label": "GatewayLLM: model only via gateway"}], "arrow": "uses", "linked": true, "note": "the agent uses its tools; its model calls go through the gateway"}, {"id": "tools", "label": "6 agent tools", "sub": "document_agent.py:145 … :243", "type": "backend", "does": "The agent's 6 tools. page_text opens any page, search_text searches the document, find_definition finds what a term like EBITDA means. covenant_library, validate_formula and lookup_identifier call Spring's Java business rules. Each tool call counts against the skill's limit.", "say": "The agent can look things up, but only through these tools.", "data": "", "sources": [{"path": "dps/src/dps/agent/document_agent.py", "line": 145, "end": 159, "label": "page_text, search_text, find_definition"}, {"path": "dps/src/dps/agent/document_agent.py", "line": 201, "end": 221, "label": "covenant_library, lookup_identifier (Java)"}, {"path": "dps/src/dps/agent/document_agent.py", "line": 224, "end": 240, "label": "validate_formula (Java)"}], "arrow": "HTTP batch", "linked": true, "note": "covenant_library and validate_formula call Spring's Java rules"}, {"id": "java", "label": "Spring Java rules", "sub": "integrations/spring_tools.py:113", "type": "external", "does": "Business rules stay in Java inside the Spring app: the formula engine, the covenant library, master-data lookups. DPS calls them over HTTP, batched, with timeouts, retries and a circuit breaker. If Spring is down, the field gets SPRING_UNAVAILABLE and goes to review; the job continues.", "say": "One rule engine for the bank, in Spring; DPS uses it as tools.", "data": "", "sources": [{"path": "dps/src/dps/integrations/spring_tools.py", "line": 113, "end": 237, "label": "SpringTools client"}, {"path": "contracts/spring-tools.yaml", "line": 27, "end": null, "label": "tools contract"}], "arrow": "", "linked": false, "note": ""}, {"id": "gateway", "label": "Gateway.call_json", "sub": "agent/gateway.py:242", "type": "security", "does": "Every model call goes through here: picks the route (small, strong, vision), retries at 2, 8 and 30 seconds, opens a circuit breaker on repeated failure, and stops the job at its token budget. The guard allows only approved hosts, masks personal data and logs each call.", "say": "No call reaches a model without the gateway's checks.", "data": "dps_ai_call, dps_ai_usage", "sources": [{"path": "dps/src/dps/agent/gateway.py", "line": 242, "end": 257, "label": "call_json: route, retries, breaker"}, {"path": "dps/src/dps/agent/gateway.py", "line": 126, "end": 130, "label": "JobBudget: tokens"}, {"path": "dps/src/dps/agent/guard.py", "line": 144, "end": 169, "label": "guarded: hosts, masking, call log"}], "arrow": "HTTPS", "linked": true, "note": ""}, {"id": "azure", "label": "Bank Azure OpenAI", "sub": "selected pages only", "type": "cloud", "does": "The bank's own Azure OpenAI deployment (gpt-4.1, mini, 4o) on a private endpoint. Only the selected page text of this job is sent; nothing is stored there.", "say": "Only the chosen pages leave the machine, and only to the bank's own model.", "data": "", "sources": [{"path": "dps/src/dps/agent/gateway.py", "line": 150, "end": 283, "label": "Gateway: routes small / strong / vision"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l8", "label": "8 · Check every answer (skills/, ledger, Spring)", "blocks": [{"id": "schema", "label": "schema check, 1 repair", "sub": "agent/document_agent.py:293", "type": "security", "does": "The agent's answer must parse as JSON and match the skill's schema.json. One repair call is allowed; a second failure is MODEL_OUTPUT_INVALID and the rules answer is used.", "say": "A badly shaped answer is repaired once or discarded.", "data": "", "sources": [{"path": "dps/src/dps/agent/document_agent.py", "line": 293, "end": 318, "label": "read: schema + one repair"}, {"path": "dps/src/dps/skills/covenants/schema.json", "line": 1, "end": 8, "label": "skill answer schema"}], "arrow": "", "linked": true, "note": ""}, {"id": "grounded", "label": "Quote on the page?", "sub": "skills/common.py:53", "type": "security", "does": "Every value must quote its page, and the quote must really be on that page (spaces and line breaks ignored). A value whose quote is not found is dropped (AI_UNGROUNDED).", "say": "This is how DPS stops invented values.", "data": "", "sources": [{"path": "dps/src/dps/skills/common.py", "line": 53, "end": 69, "label": "grounded: drop if not on page"}], "arrow": "yes", "linked": true, "note": "no: the value is dropped"}, {"id": "numbers", "label": "number in quote", "sub": "skills/runner.py:64", "type": "security", "does": "The threshold in the field must appear inside its quote. '1.25' must be in 'not less than 1.25 times'; otherwise the field is flagged for review.", "say": "The number and its sentence must agree.", "data": "", "sources": [{"path": "dps/src/dps/skills/runner.py", "line": 64, "end": 83, "label": "check_numbers"}], "arrow": "", "linked": true, "note": ""}, {"id": "vote", "label": "rules vs agent vote", "sub": "skills/runner.py:223", "type": "backend", "does": "Rules and agent are compared. Same value: RULES+AI_CONFIRMED. Different: MODELS_DISAGREE, goes to review. Found only by the agent: kept with method AI and sent to review (a person decides).", "say": "Two independent readers; disagreement always goes to a person.", "data": "", "sources": [{"path": "dps/src/dps/skills/runner.py", "line": 223, "end": 249, "label": "_vote_covenants"}, {"path": "dps/src/dps/skills/runner.py", "line": 163, "end": 194, "label": "_agent_only: review"}], "arrow": "", "linked": true, "note": ""}, {"id": "ledger", "label": "ledger: every duty", "sub": "covenants/ledger.py:146", "type": "backend", "does": "Lists every duty sentence in the whole document and gives each one state: FINDING, COVERED, NOT_A_COVENANT or UNRESOLVED. Unresolved sentences get a second agent read (omissions); what is still unresolved becomes a review item.", "say": "Nothing can be missed silently: every duty sentence is accounted for.", "data": "", "sources": [{"path": "dps/src/dps/skills/covenants/ledger.py", "line": 121, "end": 143, "label": "candidates: every duty sentence"}, {"path": "dps/src/dps/skills/covenants/ledger.py", "line": 146, "end": 183, "label": "settle: one state each"}, {"path": "dps/src/dps/skills/covenants/omissions.py", "line": 82, "end": 139, "label": "second read of unresolved sentences"}], "arrow": "", "linked": true, "note": ""}, {"id": "score", "label": "Java check, code, score", "sub": "codes.py:34 · scoring:211", "type": "backend", "does": "Formulas are checked by Spring's Java engine in one batched call. Each covenant gets a taxonomy code such as FIN_DSCR (228 types); a missing value is only a suggestion. The scorer gives each field a confidence and a route: risky or unsure fields always go to review; 3% are sampled for QA.", "say": "Each covenant gets a standard name and a confidence.", "data": "", "sources": [{"path": "dps/src/dps/integrations/spring_tools.py", "line": 151, "end": 161, "label": "validate_formulas: batched (runner.py:116)"}, {"path": "dps/src/dps/skills/covenants/codes.py", "line": 34, "end": 75, "label": "stamp: taxonomy code"}, {"path": "dps/src/dps/scoring/__init__.py", "line": 211, "end": 236, "label": "Scorer: confidence + route"}], "arrow": null, "linked": false, "note": ""}]}, {"id": "l9", "label": "9 · Result and review (runner.py, feed.py, api/)", "blocks": [{"id": "finish", "label": "finish: dps_run", "sub": "skills/runner.py:557", "type": "database", "does": "Saves the result, dps.result/1.0, as JSON in dps_run, together with the event dps.extraction.needs_review in one transaction. The job status becomes NEEDS_REVIEW (or DONE).", "say": "The result and its event are saved together, so Spring never misses one.", "data": "dps_run, dps_event_feed, dps_job", "sources": [{"path": "dps/src/dps/skills/runner.py", "line": 557, "end": 563, "label": "finish: save dps.result/1.0"}, {"path": "dps/src/dps/models.py", "line": 267, "end": 281, "label": "Run table (dps_run)"}, {"path": "contracts/schemas/result.json", "line": 82, "end": null, "label": "extraction (result) schema"}], "arrow": "", "linked": true, "note": ""}, {"id": "event", "label": "event needs_review", "sub": "feed.py:39", "type": "messagebus", "does": "The event Spring reads from GET /dps/v1/events after its last seen number. Optionally DPS can also push events to Spring.", "say": "Spring learns the result is ready.", "data": "dps_event_feed", "sources": [{"path": "dps/src/dps/feed.py", "line": 39, "end": 41, "label": "emit_for_job: same transaction"}], "arrow": "", "linked": true, "note": ""}, {"id": "pull", "label": "Spring pulls result", "sub": "api/jobs.py:352", "type": "external", "does": "Spring calls GET /dps/v1/jobs/{id}/result and gets the result in the result.json shape. It shows each field on its review screen with the page and the highlighted quote.", "say": "Spring pulls the result; DPS never writes into Spring.", "data": "", "sources": [{"path": "dps/src/dps/api/jobs.py", "line": 351, "end": 368, "label": "job_result: GET /jobs/{id}/result"}, {"path": "contracts/schemas/result.json", "line": 82, "end": null, "label": "result field shape"}], "arrow": "", "linked": true, "note": ""}, {"id": "review", "label": "Person reviews", "sub": "api/review.py:141 · new run", "type": "external", "does": "The person accepts, edits or rejects each field. Spring sends the decisions to POST /dps/v1/jobs/{id}/review; DPS saves them as a new run (the old run never changes) and keeps them for learning.", "say": "A person always approves; every decision is kept.", "data": "dps_review_decision, new dps_run", "sources": [{"path": "dps/src/dps/api/review.py", "line": 140, "end": 195, "label": "submit_review: accept / edit / reject"}], "arrow": "", "linked": true, "note": ""}, {"id": "decide", "label": "Spring decides compliance", "sub": "never DPS", "type": "external", "does": "Spring saves the approved covenants as immutable, updates the schedule and runs the compliance calculation. DPS never decides compliance or a breach.", "say": "DPS proposes with evidence; Spring and the person decide.", "data": "Spring database", "sources": [], "arrow": null, "linked": false, "note": ""}]}, {"id": "l10", "label": "10 · DB schema: SQL Server schema dps (models.py)", "blocks": [{"id": "t_job", "label": "dps_job", "sub": "models.py:128 · the queue", "type": "database", "does": "The queue and the life of every job: type, status, priority, lease (locked_by, locked_until), attempts, the request Spring sent. dps_job_attempt keeps each try; dps_batch keeps bulk uploads.", "say": "This table is the job queue.", "data": "", "sources": [{"path": "dps/src/dps/models.py", "line": 128, "end": 178, "label": "Job: status, lease, request"}, {"path": "dps/src/dps/models.py", "line": 199, "end": 211, "label": "JobAttempt: each try"}, {"path": "dps/src/dps/models.py", "line": 181, "end": 196, "label": "Batch: bulk upload"}], "arrow": "", "linked": false, "note": ""}, {"id": "t_doc", "label": "dps_document", "sub": "models.py:78 · the file", "type": "database", "does": "One record per document version: file name, SHA-256, object key, type, tenant, status. dps_document_cp_link links it to credit proposals.", "say": "Which file, which version, which CP.", "data": "", "sources": [{"path": "dps/src/dps/models.py", "line": 78, "end": 108, "label": "Document: version, sha256, object key"}, {"path": "dps/src/dps/models.py", "line": 111, "end": 125, "label": "DocumentCpLink: CP links"}], "arrow": "", "linked": false, "note": ""}, {"id": "t_artifact", "label": "dps_artifact", "sub": "models.py:245 · page models", "type": "database", "does": "Every file DPS derives (page models, page images), with its hash and pipeline version, so it can be reused. dps_flow_state keeps the CrewAI Flow's saved state.", "say": "What DPS made from each file.", "data": "", "sources": [{"path": "dps/src/dps/models.py", "line": 245, "end": 264, "label": "Artifact: dit trail"}], "arrow": null, "linked": false, "note": ""}]}]};
const flowEl = document.getElementById('flow'), detail = document.getElementById('detail'), rootEl = document.getElementById('root');
const order = []; const where = {};
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
const saved = store('dps-root'); if (saved) rootEl.value = saved;
rootEl.addEventListener('input', () => { store('dps-root', rootEl.value); if (current) show(current, true); });
const savedTheme = store('dps-theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
document.getElementById('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store('dps-theme', next);
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.lanes.forEach((lane, li) => {
  const sec = document.createElement('section'); sec.className = 'lane';
  sec.innerHTML = `<h2>${esc(lane.label)}</h2>`;
  const row = document.createElement('div'); row.className = 'row';
  lane.blocks.forEach((b, bi) => {
    order.push(b.id); where[b.id] = {b, lane};
    const el = document.createElement('button'); el.className = 'blk'; el.id = 'b-' + b.id;
    el.style.setProperty('--c', `var(--t-${b.type})`);
    el.innerHTML = `<b>${esc(b.label)}</b><span>${esc(b.sub)}</span>`;
    el.onclick = () => show(b.id);
    row.appendChild(el);
    if (bi < lane.blocks.length - 1 && b.linked) {
      const a = document.createElement('div'); a.className = 'arrow';
      a.innerHTML = `<i>→</i>${b.arrow ? esc(b.arrow) : ''}`; row.appendChild(a);
    } else if (bi < lane.blocks.length - 1) {
      const a = document.createElement('div'); a.className = 'arrow'; a.innerHTML = '<i>·</i>'; row.appendChild(a);
    }
  });
  sec.appendChild(row); flowEl.appendChild(sec);
  if (li > 0 && li < DATA.lanes.length - 2) { const d = document.createElement('div'); d.className = 'down'; d.textContent = '↓'; flowEl.appendChild(d); }
  if (li === 0) { const d = document.createElement('div'); d.className = 'down'; d.textContent = '↓ the flow starts here'; d.style.fontSize = '13px'; flowEl.appendChild(d); }
});
let current = null;
function winPath(p){ return rootEl.value.replace(/[\\/]+$/, '') + '\\' + p.replace(/\//g, '\\'); }
function vscode(p, line){ const r = rootEl.value.replace(/\\/g, '/').replace(/\/+$/, ''); return `vscode://file/${encodeURI(r + '/' + p)}:${line}:1`; }
function show(id, quiet){
  current = id; const {b, lane} = where[id];
  document.querySelectorAll('.blk.sel').forEach(e => e.classList.remove('sel'));
  const el = document.getElementById('b-' + id); el.classList.add('sel');
  if (!quiet) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  const i = order.indexOf(id);
  const srcs = b.sources.map((s, k) => {
    const range = s.end && s.end !== s.line ? `${s.line}-${s.end}` : `${s.line}`;
    return `<div class="src"><div class="lbl">${esc(s.label || s.path)}</div>
      <code>${esc(winPath(s.path))} : line ${range}</code>
      <a href="${vscode(s.path, s.line)}">Open in VS Code at line ${s.line}</a>
      <button data-copy="${esc(winPath(s.path))}:${s.line}">Copy path</button></div>`;
  }).join('') || '<p class="note">This block is outside DPS (Spring or a person), so there is no DPS code to open.</p>';
  detail.innerHTML = `<div class="stage">${esc(lane.label)} · block ${i + 1} of ${order.length}</div>
    <h3>${esc(b.label)}<span class="type" style="--c:var(--t-${b.type})">${esc(b.type)}</span></h3>
    <div class="stage">${esc(b.sub)}</div>
    <h4>What this block does</h4><p>${esc(b.does)}</p>
    ${b.note ? `<p class="note">Branch: ${esc(b.note)}</p>` : ''}
    <h4>Say this</h4><p class="say">${esc(b.say)}</p>
    ${b.data ? `<h4>Where the data is after this block</h4><p>${esc(b.data)}</p>` : ''}
    <h4>Code (opens on this laptop)</h4>${srcs}
    <div class="nav"><button onclick="step(-1)">◀ Previous</button><button onclick="step(1)">Next ▶</button></div>`;
  detail.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = () => {
    const t = btn.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
      () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy path', 1200); },
      () => { window.prompt('Copy this path:', t); });
  });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function step(d){ const i = order.indexOf(current); show(order[Math.min(order.length - 1, Math.max(0, i + d))]); }
window.step = step;
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => { if (e.target === rootEl) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
show(where[location.hash.slice(1)] ? location.hash.slice(1) : 'spring', true);
</script>
